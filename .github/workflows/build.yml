name: build
on:
  push:
    branches:
      - main
    paths-ignore:
      - helm/**/*

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Build the Docker image
              run: docker build . --file Dockerfile --tag ${{ vars.DOCKER_USERNAME }}/go-app:${{github.run_id}}
            - name: Push the Docker image to Docker Hub
              run: |
                echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ vars.DOCKER_USERNAME }}" --password-stdin
                docker push ${{ vars.DOCKER_USERNAME }}/go-app:${{github.run_id}}
 
    update-newtag-in-helm-chart:
      runs-on: ubuntu-latest

      needs: build

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.TOKEN }}

        - name: Update tag in Helm chart
          run: |
            sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/go-web-app-chart/values.yaml

        - name: Commit and push changes
          run: |
           git config --global user.email "kumarnaveenssnp@gmail.com"
           git config --global user.name "Naveenkumar511"
           git add helm/go-web-app-chart/values.yaml
           git commit -m "Update tag in Helm chart"
           git push