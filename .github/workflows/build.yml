name: build
on:
  push:
    branches:
      - main
    paths-ignore:
      - helm/**/*

jobs:
    build:
        runs-on: ubuntu-latest
        environment: DEV
        steps:
            - uses: actions/checkout@v3
            - name: Validate Docker secrets
              run: |
                if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
                  echo "ERROR: DOCKER_USERNAME or DOCKER_PASSWORD secret is missing."
                  exit 1
                fi
            - name: Set image tag
              run: echo "IMAGE_TAG=$DOCKER_USERNAME/go-app:${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
            - name: Build the Docker image
              run: docker build . --file Dockerfile --tag "$IMAGE_TAG"
            - name: Push the Docker image to Docker Hub
              run: |
                echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
                docker push "$IMAGE_TAG"
 
    update-newtag-in-helm-chart:
      runs-on: ubuntu-latest

      needs: build

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.TOKEN }}

        - name: Update tag in Helm chart
          run: |
            sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/go-web-app-chart/values.yaml

        - name: Commit and push changes
          run: |
           git config --global user.email "kumarnaveenssnp@gmail.com"
           git config --global user.name "Naveenkumar511"
           git add helm/go-web-app-chart/values.yaml
           git commit -m "Update tag in Helm chart"
           git push